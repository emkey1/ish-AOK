[package]
name = "rust_native_probe"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_native_probe"
crate-type = ["staticlib"]

# tokio answers one question, and it is off by default because the answer is
# already known and the dependency is not free:
#
#     cargo build --release --features tokio-probe
#
# helix and most large Rust TUIs are built on tokio, and its reactor is kqueue
# on Apple targets. The shim routes neither kqueue nor epoll, so the runtime
# builds a HOST kqueue and registers GUEST descriptor numbers in it. It does
# not half-work: Runtime::build fails with EBADF before a single task runs.
#
# Left buildable rather than deleted so the result can be re-measured the day
# kqueue is routed, which is the one piece of work between here and running a
# large async Rust program natively. tools/check-native-libc.py names the whole
# gap when this feature is on: kqueue, kevent, sendfile.
[features]
default = []
tokio-probe = ["dep:tokio"]

[dependencies]
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "net", "sync"] }

[profile.release]
opt-level = "z"
panic = "abort"
strip = true
