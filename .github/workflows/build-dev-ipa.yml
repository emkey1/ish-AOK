name: Build Dev IPA

on:
  push:
    branches: [working]
  workflow_dispatch:

concurrency:
  group: build-dev-ipa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # This job publishes an IPA under the dev-latest release, so it must only run
    # in an iSH-AOK repository. A checkout whose origin has been repointed at an
    # unrelated project still pushes `working`, and without this guard that repo
    # runs THIS workflow and publishes an iSH-AOK build under someone else's name
    # (happened 2026-08-07: a 40 MB iSH-AOK IPA appeared as a public prerelease
    # on an unrelated project).
    #
    # Matched on repository NAME, not owner/name, so a fork still builds its own
    # dev IPAs. That is the whole point: the failure mode being prevented is the
    # tree landing in a DIFFERENTLY NAMED repo, which a fork is not. The trailing
    # slash matters, it stops `owner/not-ish-AOK` from matching.
    if: endsWith(github.repository, '/ish-AOK')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Select newest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install llvm lld ninja libarchive
          pip3 install --break-system-packages meson
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      # helix is compiled in (AOK_NATIVE_HELIX=YES in app/iSH.xcconfig) and helix
      # is Rust, so the build needs a Rust toolchain that can emit iOS objects.
      # The runners ship cargo but not the iOS target, and meson's native_rust
      # is `auto`: it sees cargo, enables the Rust program, and only then fails
      # on the missing target. Detecting cargo is not the same as being able to
      # build for iOS, so install the target rather than relying on auto.
      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios
      - name: Build hterm_all.js
        run: |
          cd deps/libapps/hterm
          python3 bin/mkdist

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -scheme iSH \
            -configuration Release \
            -arch arm64 -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/iSH-AOK.app"
          test -d "$APP_PATH"
          SHORT_SHA=$(git rev-parse --short HEAD)
          IPA_NAME="iSH-AOK-dev-${SHORT_SHA}.ipa"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "$IPA_NAME" Payload
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_NAME="${{ steps.package.outputs.ipa_name }}"
          SHORT_SHA="${{ steps.package.outputs.short_sha }}"
          BODY="Unsigned development build from commit ${SHORT_SHA} (auto-published from \`working\`). Re-sign with AltStore, SideStore, or Sideloadly before installing. This release is overwritten on every push."
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release delete dev-latest --yes --cleanup-tag
          fi
          gh release create dev-latest "$IPA_NAME" \
            --title "Development Build (${SHORT_SHA})" \
            --notes "$BODY" \
            --prerelease \
            --target "${{ github.sha }}"
