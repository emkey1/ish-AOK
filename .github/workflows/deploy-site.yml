name: Deploy Site
on:
  release:

jobs:
  deploy:
    # Fires on any release event, including one created by the dev-IPA workflow,
    # so a foreign repo running our workflows also fires this. It has no secret
    # there and just fails noisily (observed 2026-08-09). Name-matched so forks
    # still work, see build-dev-ipa.yml for the reasoning.
    if: endsWith(github.repository, '/ish-AOK')
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Deploy
      run: curl -d {} $NETLIFY_DEPLOY_HOOK
      env:
        NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
