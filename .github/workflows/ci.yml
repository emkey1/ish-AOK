name: CI

on:
  push:
    branches: [working, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # `submodules: true` stops one level down, and two of smallclue's own
      # submodules are part of this build: third-party/openssh (ssh, scp, sftp,
      # ssh-keygen) and third-party/nextvi (vi). Without them meson swaps in
      # stubs and says so only as a setup WARNING, which is how this job kept
      # passing while a recursive clone of the same tree could not compile
      # OpenSSH on Linux at all. Just those two: meson uses none of smallclue's
      # other submodules (dvtm, libgit2, openrsync).
      - name: Check out smallclue's openssh and nextvi
        run: git -C deps/smallclue submodule update --init third-party/openssh third-party/nextvi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libsqlite3-dev
          pip3 install meson ninja
      # deps/dash needs its config.h, which the fork does not commit (the
      # generated sources are committed; see tools/configure-dash.sh). Configure
      # ONLY: `make` fails from a clean checkout and can regenerate nodes.c
      # without the __thread conversion.
      - name: Configure deps/dash
        run: cd deps/dash && ../../tools/configure-dash.sh --quiet
      - name: Build
        run: |
          meson setup build -Dengine=jit
          ninja -C build
        env:
          CC: ${{matrix.cc}}
      - name: Unit tests
        run: meson test -C build float80 riscv64_decode --print-errorlogs
      - name: e2e tests
        run: meson test -C build e2e --print-errorlogs

  build-mac:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # See build-linux. Here the missing trees cost more than coverage: the
      # IPA workflows check out the same way, so every IPA they built shipped
      # an ssh that says "not built into this iSH-AOK" and a stub vi.
      - name: Check out smallclue's openssh and nextvi
        run: git -C deps/smallclue submodule update --init third-party/openssh third-party/nextvi
      - name: Select newest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
      - name: Install dependencies
        run: |
          brew install llvm lld ninja libarchive
          pip3 install --break-system-packages meson
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      # helix is compiled in (AOK_NATIVE_HELIX=YES in app/iSH.xcconfig) and helix
      # is Rust, so the build needs a Rust toolchain that can emit iOS objects.
      # The runners ship cargo but not the iOS target, and meson's native_rust
      # is `auto`: it sees cargo, enables the Rust program, and only then fails
      # on the missing target. Detecting cargo is not the same as being able to
      # build for iOS, so install the target rather than relying on auto.
      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios
      - name: Build hterm_all.js
        run: |
          cd deps/libapps/hterm
          python3 bin/mkdist
      # deps/dash needs its config.h, which the fork does not commit (the
      # generated sources are committed; see tools/configure-dash.sh). Configure
      # ONLY: `make` fails from a clean checkout and can regenerate nodes.c
      # without the __thread conversion.
      - name: Configure deps/dash
        run: cd deps/dash && ../../tools/configure-dash.sh --quiet
      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -scheme iSH-AOK \
            -configuration Release \
            -arch arm64 -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
