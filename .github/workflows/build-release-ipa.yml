name: Build Release IPA

on:
  push:
    tags:
      - 'builds/iSH-AOK_*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing builds/iSH-AOK_N tag to (re)build'
        required: true

env:
  KEEP_RELEASES: 5

permissions:
  contents: write

jobs:
  build:
    # Publishes the numbered build release, and prunes old ones (KEEP_RELEASES),
    # so it must only run in an iSH-AOK repository: pushing the tags to a repo
    # whose origin was misconfigured would both publish our IPA there and start
    # deleting that repo's releases. Name-matched so forks still work, see
    # build-dev-ipa.yml for the reasoning.
    if: endsWith(github.repository, '/ish-AOK')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: true
          fetch-depth: 0

      - name: Select newest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install llvm lld ninja libarchive
          pip3 install --break-system-packages meson
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Build hterm_all.js
        run: |
          cd deps/libapps/hterm
          python3 bin/mkdist

      - name: Patch pre-existing tags for Apple Silicon Homebrew paths
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("tools/meson.build")
          old = p.read_text()
          pattern = re.compile(
              r"    libarchive_lib = cc\.find_library\('archive', dirs: \['/usr/local/opt/libarchive/lib'\], required: false\)\n"
              r"    if not libarchive_lib\.found\(\)\n"
              r"        libarchive_lib = cc\.find_library\('archive', dirs: \['/opt/homebrew/opt/libarchive/lib'\], required: false\)\n"
              r"    endif\n"
              r"    if libarchive_lib\.found\(\)\n"
              r"        libarchive = declare_dependency\(dependencies: \[libarchive_lib\], include_directories: include_directories\(\['/usr/local/opt/libarchive/include'\]\)\)\n"
              r"    endif\n"
          )
          new = (
              "    libarchive_prefix = '/usr/local/opt/libarchive'\n"
              "    libarchive_lib = cc.find_library('archive', dirs: [libarchive_prefix + '/lib'], required: false)\n"
              "    if not libarchive_lib.found()\n"
              "        libarchive_prefix = '/opt/homebrew/opt/libarchive'\n"
              "        libarchive_lib = cc.find_library('archive', dirs: [libarchive_prefix + '/lib'], required: false)\n"
              "    endif\n"
              "    if libarchive_lib.found()\n"
              "        libarchive = declare_dependency(dependencies: [libarchive_lib], include_directories: include_directories([libarchive_prefix + '/include']))\n"
              "    endif\n"
          )
          if pattern.search(old):
              p.write_text(pattern.sub(new, old))
              print("patched tools/meson.build for Apple Silicon Homebrew (pre-fix tag)")
          else:
              print("tools/meson.build already has the fix, no patch needed")
          PYEOF

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -scheme iSH \
            -configuration Release \
            -arch arm64 -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/iSH-AOK.app"
          test -d "$APP_PATH"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BUILD_N="${TAG##*_}"
          IPA_NAME="iSH-AOK-${BUILD_N}.ipa"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "$IPA_NAME" Payload
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_n=$BUILD_N" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.package.outputs.tag }}"
          IPA_NAME="${{ steps.package.outputs.ipa_name }}"
          BUILD_N="${{ steps.package.outputs.build_n }}"
          PREV_N=$((BUILD_N - 1))
          NOTES_FILE="release-notes-since-iSH-AOK_${PREV_N}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--notes "Unsigned build ${BUILD_N}. Re-sign with AltStore, SideStore, or Sideloadly before installing.")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_NAME" --clobber
          else
            gh release create "$TAG" "$IPA_NAME" \
              --title "iSH-AOK Build ${BUILD_N}" \
              "${NOTES_ARGS[@]}" \
              --latest
          fi

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.tagName | startswith("builds/iSH-AOK_")) | .tagName' \
            | sort -t_ -k2 -n -r \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r old_tag; do
                echo "Pruning release $old_tag (keeping tag, deleting release + asset only)"
                gh release delete "$old_tag" --yes
              done
